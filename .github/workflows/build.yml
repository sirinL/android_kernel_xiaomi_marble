name: Build Marble Docker Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 清理云主机磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 2. 拉取内核源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 3. 安装编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 pahole dwarves

      - name: 4. 下载 Google 官方 Clang 编译器 (r416183b)
        run: |
          mkdir -p $HOME/clang
          curl -fsSL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-r416183b.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/clang

      - name: 5. 自动解除 GKI 限制并编译 Docker 内核
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 自动注释 build.config.gki.aarch64 中的严格符号校验，无需手动改文件
          if [ -f "build.config.gki.aarch64" ]; then
            sed -i 's/^ABI_DEFINITION=/#ABI_DEFINITION=/g' build.config.gki.aarch64
            sed -i 's/^KMI_SYMBOL_LIST_STRICT_MODE=/#KMI_SYMBOL_LIST_STRICT_MODE=/g' build.config.gki.aarch64
            sed -i 's/^TRIM_NONLISTED_KMI=/#TRIM_NONLISTED_KMI=/g' build.config.gki.aarch64
          fi

          # 优先使用作者为 marble 调优好的 marble_defconfig
          if [ -f "arch/arm64/configs/marble_defconfig" ]; then
            DEFCONFIG="marble_defconfig"
          else
            DEFCONFIG="gki_defconfig"
          fi
          
          make O=out LLVM=1 LLVM_IAS=1 $DEFCONFIG
          
          # 注入不破坏 GKI KMI 结构体的 Docker 必备配置，严格保留 MODVERSIONS
          ./scripts/config --file out/.config \
            -e NAMESPACES -e UTS_NS -e IPC_NS -e PID_NS -e NET_NS \
            -e CGROUPS -e CGROUP_FREEZER -e CGROUP_PIDS -e CGROUP_DEVICE -e CGROUP_CPUACCT -e CGROUP_PERF -e CGROUP_BPF -e CPUSETS -e MEMCG \
            -e VETH -e BRIDGE -e BRIDGE_NETFILTER -e IP_NF_FILTER -e IP_NF_NAT -e IP_NF_TARGET_MASQUERADE -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_MATCH_CONNTRACK \
            -e OVERLAY_FS -e SYSVIPC -e POSIX_MQUEUE \
            -d ANDROID_PARANOID_NETWORK \
            -e MODVERSIONS -d TRIM_UNUSED_KSYMS
          
          make O=out LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out LLVM=1 LLVM_IAS=1 -j$(nproc --all) Image

      - name: 6. 配置 AnyKernel3 (匹配 marble 分区)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/g' AnyKernel3/anykernel.sh
          
          cp out/arch/arm64/boot/Image AnyKernel3/
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/*placeholder

      - name: 7. 打包上传单层 AnyKernel3 刷机包
        uses: actions/upload-artifact@v5
        with:
          name: Marble-Docker-Kernel-AK3
          path: AnyKernel3/*
